name: Build YSBrowser ProUnlock dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build dylib with clang
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          clang -arch arm64 -dynamiclib \
            -isysroot "$SDK" \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -o YSBrowserProUnlock.dylib \
            Tweak.m
          ldid -S YSBrowserProUnlock.dylib
          ls -la YSBrowserProUnlock.dylib
          otool -L YSBrowserProUnlock.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: YSBrowserProUnlock-dylib
          path: YSBrowserProUnlock.dylib
          retention-days: 7
