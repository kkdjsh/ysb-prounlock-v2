name: Build YSBrowser ProUnlock Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=/opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          sudo ln -s $THEOS /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          cd /opt/theos/sdks
          sudo wget -q https://github.com/theos/sdks/archive/refs/heads/master.zip -O sdks.zip
          sudo unzip -q sdks.zip
          sudo mv sdks-master/*.sdk .
          sudo rm -rf sdks.zip sdks-master
          ls -la

      - name: Build Tweak
        run: |
          export THEOS=/opt/theos
          make package FINAL=out
        env:
          THEOS: /opt/theos

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: YSBrowserProUnlock-dylib
          path: |
            packages/*.deb
            .theos/_/Users/*/YSBrowserProUnlock.dylib
          retention-days: 7
