name: Build YSBrowser ProUnlock dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build dylib with clang
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -dynamiclib \
            -isysroot "$SDK" \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -o libsqlite3.dylib \
            Tweak.m
          ldid -S libsqlite3.dylib
          ls -la libsqlite3.dylib
          otool -L libsqlite3.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libsqlite3-dylib
          path: libsqlite3.dylib
          retention-days: 7
